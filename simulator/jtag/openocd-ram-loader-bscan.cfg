# Custom BSCANE2 USER DR path. Source the selected board/adapter config first.
# The board MUST declare the physical FPGA TAP (IR length, chain order, expected
# IDCODE) and set these variables. Exact XCZU15EG offline BSDL values are
# validated below; no TAP declaration, order, adapter, speed or reset guess.
# BSDL says PRIVATE USER instructions work only after FPGA configuration.
# This check does not replace the new-image post-synthesis USER allocation guard.
foreach setting {VALENCE_RAM_TAP VALENCE_RAM_FPGA_PART VALENCE_RAM_FPGA_IRLEN VALENCE_RAM_JTAG_CHAIN VALENCE_RAM_USER_IR VALENCE_RAM_FPGA_IDCODE} {
    if {![info exists $setting]} {error "Board configuration must set $setting"}
}
set VALENCE_RAM_BACKEND bscan
source [file join [file dirname [info script]] ram-loader.tcl]
source [file join [file dirname [info script]] ram-loader-bscan.tcl]
# Fail before any adapter-related command; repeat validation at runtime so a
# later accidental variable change cannot scan USER1 or a truncated opcode.
valence_ram::validate_xczu15eg_configuration
transport select jtag
gdb port disabled
tcl port disabled
telnet port disabled
# No native riscv target or use_bscan_tunnel; no automatic init/download/reset.
# Initialize OpenOCD FIRST, then type j at the ROM UART prompt, then explicitly
# invoke valence_download_and_run FILE ENTRY through a loopback control session.
