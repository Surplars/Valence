# Custom BSCANE2 USER DR path. Source the selected board/adapter config first.
# The board MUST declare the physical FPGA TAP (IR length, chain order, expected
# IDCODE) and set these variables. No chip/adapter/pin/clock/reset guesses here.
foreach setting {VALENCE_RAM_TAP VALENCE_RAM_USER_IR VALENCE_RAM_FPGA_IDCODE} {
    if {![info exists $setting]} {error "Board configuration must set $setting"}
}
transport select jtag
gdb port disabled
tcl port disabled
telnet port disabled
set VALENCE_RAM_BACKEND bscan
source [file join [file dirname [info script]] ram-loader.tcl]
source [file join [file dirname [info script]] ram-loader-bscan.tcl]
# No native riscv target or use_bscan_tunnel; no automatic init/download/reset.
# Initialize OpenOCD FIRST, then type j at the ROM UART prompt, then explicitly
# invoke valence_download_and_run FILE ENTRY through a loopback control session.
