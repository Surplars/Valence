# Board-independent, transport-only Valence RAM downloader.
# First source a user-selected board/adapter configuration with verified pins,
# voltage, TCK rate and reset wiring. This file supplies NONE of those defaults.
# Do not combine with target create ... riscv: this endpoint cannot halt a hart,
# access GPRs/abstract commands, expose GDB, or run native RISC-V examine hooks.
# If the board already declared the TAP, set VALENCE_RAM_TAP to its exact name.
# VALENCE_RAM_IDCODE may override the unassigned project test identity below.
transport select jtag
# No network listeners by default. A deliberately enabled control service must
# be bound to loopback by the calling board configuration.
gdb port disabled
tcl port disabled
telnet port disabled
if {![info exists VALENCE_RAM_IDCODE]} {set VALENCE_RAM_IDCODE 0x00000001}
if {![info exists VALENCE_RAM_TAP]} {
    jtag newtap valence dtm -irlen 5 -ircapture 0x01 -irmask 0x03 -expected-id $VALENCE_RAM_IDCODE
    set VALENCE_RAM_TAP valence.dtm
}
set VALENCE_RAM_BACKEND direct
source [file join [file dirname [info script]] ram-loader.tcl]
# No automatic init, reset, download, COMMIT, ABORT, or shutdown. Initialize
# OpenOCD FIRST (init resets the TAP), THEN type j at the ROM UART prompt,
# THEN explicitly invoke valence_download_and_run image.bin 0x80200000.
