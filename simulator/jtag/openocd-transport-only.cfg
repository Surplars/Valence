# Simulation transport test only, with Debug 1.0/0.13 DTM wire version 1.
# This intentionally declares NO riscv target and NO GDB service: no DM exists.
adapter driver remote_bitbang
remote_bitbang host 127.0.0.1
remote_bitbang port 9824
transport select jtag
reset_config trst_only
jtag newtap valence dtm -irlen 5 -ircapture 0x01 -irmask 0x03 -expected-id 0x00000001
# 0x00000001 is a project simulation placeholder, not a registered JEDEC identity.
init
jtag arp_init
irscan valence.dtm 0x01
set id [drscan valence.dtm 32 0]
echo "IDCODE $id (unassigned project test identity)"
irscan valence.dtm 0x10
set dtmcs [drscan valence.dtm 32 0]
echo "DTMCS $dtmcs (expect version=1, abits=7, idle=7)"
irscan valence.dtm 0x11
# Width 41 = op[1:0], data[33:2], address[40:34], LSB first.
drscan valence.dtm 2 1 32 0 7 0x11
runtest 16
set response [drscan valence.dtm 2 0 32 0 7 0]
echo "dmstatus access $response (expected first field 2: unavailable DM)"
shutdown
